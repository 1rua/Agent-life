services:
  # Controller must replace this placeholder with the pinned tsnet userspace
  # image/build and provide the app-scoped state directory before production.
  tailscale:
    image: tailscale/tailscale:REPLACE_WITH_LOCKED_DIGEST
    profiles: ["pending-tsnet-lock"]
    command: ["true"]

  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - tailscale
    # Sharing the private userspace namespace is deliberate. No host-port
    # publication, host networking, Funnel, or public wildcard is enabled.
    network_mode: "service:tailscale"
    environment:
      NODE_ENV: production
      BRIDGE_INGRESS_TRANSPORT: tsnet-userspace
      BRIDGE_INGRESS_PORT: "443"
      BRIDGE_TSNET_LOCK: /run/agent-life/tsnet.locked
    volumes:
      - bridge-state:/var/lib/agent-life-bridge
      - ./tsnet.locked:/run/agent-life/tsnet.locked:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:443/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  bridge-state:
