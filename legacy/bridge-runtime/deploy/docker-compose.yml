services:
  ingress:
    build:
      context: ../..
      dockerfile: bridge-runtime/deploy/Dockerfile.ingress
    init: true
    restart: unless-stopped
    environment:
      OPEN_ANDROID_INTELLIGENCE_RUNTIME_SOCKET: /run/open-android-intelligence/runtime.sock
      OPEN_ANDROID_INTELLIGENCE_TSNET_STATE_DIR: /var/lib/open-android-intelligence-ingress
      OPEN_ANDROID_INTELLIGENCE_TSNET_HOSTNAME: ${OPEN_ANDROID_INTELLIGENCE_TSNET_HOSTNAME:-open-android-intelligence-bridge}
      OPEN_ANDROID_INTELLIGENCE_TSNET_CONTROL_URL: ${OPEN_ANDROID_INTELLIGENCE_TSNET_CONTROL_URL:-https://controlplane.tailscale.com}
      OPEN_ANDROID_INTELLIGENCE_TSNET_PORT: "443"
    volumes:
      - ingress-state:/var/lib/open-android-intelligence-ingress
      - runtime-socket:/run/open-android-intelligence

  bridge:
    build:
      context: ../..
      dockerfile: bridge-runtime/deploy/Dockerfile
    init: true
    depends_on:
      - ingress
    # Both processes share one private userspace network namespace. No host,
    # Docker, Funnel, or public wildcard port is published.
    network_mode: "service:ingress"
    restart: unless-stopped
    environment:
      OPEN_ANDROID_INTELLIGENCE_DATABASE: /var/lib/open-android-intelligence-bridge/bridge.sqlite
      OPEN_ANDROID_INTELLIGENCE_PAIRING_PUBLIC_KEY: /var/lib/open-android-intelligence-bridge/secrets/pairing-ticket-public.pem
      OPEN_ANDROID_INTELLIGENCE_RUNTIME_SOCKET: /run/open-android-intelligence/runtime.sock
      OPEN_ANDROID_INTELLIGENCE_LEASE_TTL_MS: "60000"
    volumes:
      - bridge-state:/var/lib/open-android-intelligence-bridge
      - runtime-socket:/run/open-android-intelligence
      - ./secrets/pairing-ticket-public.pem:/var/lib/open-android-intelligence-bridge/secrets/pairing-ticket-public.pem:ro

volumes:
  ingress-state:
  bridge-state:
  runtime-socket:
