[project]
name = "agent-life-hermes-gateway"
version = "2.0.0"
description = "Native Python Gateway Protocol v2 plugin for Hermes"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_life_gateway*"]
namespaces = true
